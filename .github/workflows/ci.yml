name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principiul least privilege: token-ul GITHUB_TOKEN poate doar citi codul
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install (strict din lock)
        run: uv sync --locked --all-groups

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test

      - name: Dependency audit (SCA)
        run: make audit

      - name: Workflow security lint (zizmor)
        run: make actions-lint
