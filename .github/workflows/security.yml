name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # săptămânal: CVE-uri noi apar și în cod neschimbat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF în Code Scanning
    steps:
      - name: Checkout (istoric complet pentru gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install project
        run: uv sync --locked --all-groups

      - name: Install scanners (versiuni fixate + checksum)
        run: |
          bash tools/install-scanners.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: SAST (Semgrep + Bandit)
        run: make sast

      - name: Secrets (gitleaks, istoric complet)
        run: make secrets

      - name: SCA + misconfig (Trivy fs)
        run: make sca

      - name: Dockerfile lint (Hadolint)
        run: make dockerlint

      - name: Security gate
        run: make gate

      - name: Upload SARIF — semgrep
        if: always() && hashFiles('reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload SARIF — bandit
        if: always() && hashFiles('reports/bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/bandit.sarif
          category: bandit

      - name: Upload SARIF — gitleaks
        if: always() && hashFiles('reports/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - name: Upload SARIF — trivy-fs
        if: always() && hashFiles('reports/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs

      - name: Upload SARIF — hadolint
        if: always() && hashFiles('reports/hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/hadolint.sarif
          category: hadolint
