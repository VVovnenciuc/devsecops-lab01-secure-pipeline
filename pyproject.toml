[project]
name = "notes-api"
version = "0.1.0"
description = "Notes API — aplicația țintă pentru pipeline-ul DevSecOps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --cov=src/notes_api --cov=tools --cov-report=term-missing --cov-fail-under=80"

[dependency-groups]
dev = [
    "bandit[sarif]>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "zizmor>=1.30.1",
]
