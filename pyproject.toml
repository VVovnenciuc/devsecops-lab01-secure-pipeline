[project]
name = "headercheck"
version = "0.1.0"
description = "Verifică header-ele HTTP de securitate pentru unul sau mai multe URL-uri"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
headercheck = "headercheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# E/W/F = erori de bază, I = sortare importuri, B = bug-uri frecvente,
# UP = sintaxă modernă, S = reguli de SECURITATE (bandit), SIM = simplificări, RUF = ruff
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert e permis în teste

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=headercheck --cov-report=term-missing --cov-fail-under=80"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "zizmor>=1.30.1",
]
